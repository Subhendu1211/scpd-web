map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 80;
  server_name scpd.odisha.gov.in;
  client_max_body_size 110m;

  location = /case-management {
    return 301 /case-management/;
  }

  # Preserve /case-management/ because the app is configured to serve from that base path.
  location ^~ /case-management/ {
    proxy_pass http://case-app:4001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
  }

  # The SCPD web app serves its frontend and API together.
  location / {
    proxy_pass http://scpd-web:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
  }
}
